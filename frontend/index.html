<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-96.v2.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo-192.v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lientjie Meiring - Architecture Student & Designer, University of Johannesburg" />
    <title>Lientjie Meiring · Architecture</title>

    <!-- Lets the browser paint form controls and scrollbars to match either theme. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E6E6E6" media="(prefers-color-scheme: light)" />

    <!-- Sets the theme before first paint, so there is no flash. Same key and default as hooks/useTheme.jsx. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lm-theme')
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* Private mode can block localStorage; dark is the default. */
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!-- Fonts as a plain <link>, so the browser fetches them alongside the HTML. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
