<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/logo-96.v2.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo-192.v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lientjie Meiring - Architecture Student & Designer, University of Johannesburg" />
    <title>Lientjie Meiring · Architecture</title>

    <!-- Lets the browser paint form controls and scrollbars to match either theme. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E6E6E6" media="(prefers-color-scheme: light)" />

    <!-- Sets the theme before first paint, so there is no flash. Same key and default as hooks/useTheme.jsx. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lm-theme')
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* Private mode can block localStorage; dark is the default. */
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <!-- Fonts as a plain <link>, so the browser fetches them alongside the HTML. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg-0, #121212); }
      .boot span { position: relative; width: 120px; height: 2px; overflow: hidden; border-radius: 2px; background: rgba(128, 128, 128, 0.25); }
      .boot span::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #B0EFC3; animation: boot 1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot span::after { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app starts; React replaces it. Keeps the first instant from being an empty screen. -->
      <div class="boot" aria-hidden="true"><span></span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
