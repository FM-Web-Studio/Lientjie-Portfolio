name: Build & Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # The contact form posts to the sendMessage function (Lientjie-Petsitting repo), which refuses
      # calls without App Check, so a build without the key would ship a form that always fails.
      - name: Check the App Check key is set
        run: |
          if [ -z "$FIREBASE_APPCHECK_SITE_KEY" ]; then
            echo "::error::Secret FIREBASE_APPCHECK_SITE_KEY is empty. Add the reCAPTCHA Enterprise site key (Google Cloud > Fraud Defense), then run this workflow again."
            exit 1
          fi
        env:
          FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID:      ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          ADMIN_EMAILS:                 ${{ secrets.ADMIN_EMAILS }}
          FIREBASE_APPCHECK_SITE_KEY:   ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}

      # The contact form posts to the sendMessage function, deployed from the
      # Lientjie-Petsitting repo. Without it live, the form would break.
      - name: Check the contact form function is deployed
        run: |
          # This call carries no App Check token, so a live function refuses it with 401 and saves
          # nothing. 404 means it is not deployed; 5xx means it is broken.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json'             -d '{"data":{}}' https://europe-west1-lientjie-project.cloudfunctions.net/sendMessage)
          if [ "$status" != "401" ] && [ "$status" != "200" ]; then
            echo "::error::sendMessage answered $status. Deploy functions from the Lientjie-Petsitting repo first, then run this workflow again."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:              ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.SERVICE_ACCOUNT }}
          channelId:              live
          projectId:              lientjie-project
          target:                 lientjie-portfolio
          entryPoint:             frontend
